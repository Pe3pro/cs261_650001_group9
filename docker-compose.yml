services:
  db:
    image: mysql:8.4
    container_name: cs261-db
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: cs261db
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot1234"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: ./demo
    container_name: cs261-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/cs261db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root1234
      # U1: Application-Key ของ TU REST API อ่านจากไฟล์ .env (ไม่ commit) หรือ environment ของเครื่อง
      TU_API_KEY: ${TU_API_KEY:-}
      # U3: ที่เก็บไฟล์ Transcript (PDF) เก็บใน volume ไม่หายเมื่อสร้าง container ใหม่
      APP_UPLOAD_DIR: /app/uploads
      # U5: ส่ง Email แจ้งผลการพิจารณาไปที่ Mailpit (ดูอีเมลที่ http://localhost:8025)
      APP_MAIL_ENABLED: "true"
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
  # U5: กล่องจดหมายจำลองสำหรับทดสอบ Email (ไม่ส่งออกไปนอกเครื่อง)
  mailpit:
    image: axllent/mailpit
    container_name: cs261-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  web:
    image: nginx:alpine
    container_name: cs261-web
    ports:
      - "8081:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - app
      
volumes:
  db-data:
  uploads:
