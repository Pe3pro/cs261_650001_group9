# U8:T5 test harness only (not part of the app): serves ./frontend and proxies /api to the backend on the same origin,
# because the in-app test browser blocks cross-origin calls from :8081 to :8080.
# Each page gets window.*_API_BASE = location.origin injected so the unchanged frontend calls /api on :8082.
server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host $host;
    }

    location / {
        sub_filter '</head>' '<script>window.U1_API_BASE=window.U5_API_BASE=window.U8_API_BASE=location.origin;</script></head>';
        sub_filter_once on;
    }
}
